name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Leak scan
        run: ./scripts/leak-scan.sh
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
